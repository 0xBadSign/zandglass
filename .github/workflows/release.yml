# Builds the zandglass program (CLI + owner panel with the web pages
# embedded) for Linux, Windows and macOS. Runs by hand, or on a version tag,
# where it also attaches the files to a GitHub release.
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: zandglass-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: zandglass-windows-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: zandglass-macos-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            name: zandglass-macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web pages (embedded in the program)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}


      - name: Build
        run: cargo build --release --locked -p zandglass-cli --target ${{ matrix.target }}

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/${{ matrix.target }}/release/zandglass dist/${{ matrix.name }}/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/${{ matrix.name }}/
          tar -C dist -czf dist/${{ matrix.name }}.tar.gz ${{ matrix.name }}
          (cd dist && shasum -a 256 ${{ matrix.name }}.tar.gz > ${{ matrix.name }}.tar.gz.sha256)

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/${{ matrix.name }} | Out-Null
          Copy-Item target/${{ matrix.target }}/release/zandglass.exe dist/${{ matrix.name }}/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/${{ matrix.name }}/
          Compress-Archive -Path dist/${{ matrix.name }}/* -DestinationPath dist/${{ matrix.name }}.zip
          $h = (Get-FileHash dist/${{ matrix.name }}.zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist/${{ matrix.name }}.zip.sha256", "$h  ${{ matrix.name }}.zip`n")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          draft: false
          prerelease: true
