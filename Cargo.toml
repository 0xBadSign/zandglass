[workspace]
resolver = "2"
members = [
    "crates/sandglass-core",
    "crates/sandglass-wallet",
    "crates/sandglass-cli",
    "crates/sandglass-keeper",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Dependencies (scrypt, pairings, proving) are unusably slow unoptimised.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
