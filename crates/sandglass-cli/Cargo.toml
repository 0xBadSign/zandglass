[package]
name = "sandglass-cli"
description = "The sandglass command line: create vaults, flip, claim."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sandglass"
path = "src/main.rs"

[dependencies]
sandglass-core = { path = "../sandglass-core" }
sandglass-wallet = { path = "../sandglass-wallet" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
zeroize = "1.9.0"

[dev-dependencies]
sandglass-keeper = { path = "../sandglass-keeper" }

[lints]
workspace = true
