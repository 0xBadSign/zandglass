[package]
name = "zandglass-keeper"
description = "Zandglass keeper: blind mailboxes for kits and the hosted playground."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zandglass-core = { path = "../zandglass-core" }
zandglass-wallet = { path = "../zandglass-wallet" }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "fs"] }
zcash_keys = { version = "0.17.0", features = ["orchard"] }
zeroize = "1.9.0"

[dev-dependencies]
tempfile = "3"
ureq = "3"

[lints]
workspace = true
