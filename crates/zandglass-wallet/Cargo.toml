[package]
name = "zandglass-wallet"
description = "Zandglass vault manager: light-client Zcash wallet for time-locked vaults."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
zandglass-core = { path = "../zandglass-core" }
zcash_client_backend = { version = "0.25.0", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "sync"] }
zcash_client_sqlite = { version = "0.23.0", features = ["orchard"] }
zcash_primitives = "0.31.0"
zcash_protocol = "0.11.0"
zcash_keys = { version = "0.17.0", features = ["orchard"] }
zcash_address = "0.14"
zcash_proofs = { version = "0.31.0", features = ["bundled-prover"] }
zip321 = "0.10.0"
zip32 = "0.3"
orchard = "0.16.0"
bip0039 = "0.12"
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
rusqlite = "0.37"
secrecy = "0.8"
rand = "0.8"
# The Zcash wallet crates use rand 0.10 for wallet and proving randomness.
rand_crypto = { package = "rand", version = "0.10" }
age = "0.12.1"
anyhow = "1"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
zeroize = "1.9.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
